[project]
name = "ai-business-operations-analyst"
version = "0.13.0"
description = "A local-first, evidence-grounded AI business analyst."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "mlx>=0.32,<0.33",
  "mlx-lm>=0.31.3,<0.32",
  "mlx-vlm>=0.6.8,<0.7",
  "psutil>=7,<8",
  "pydantic>=2.13,<3",
  "pydantic-ai-slim[openai]>=2.38,<3",
]

[project.scripts]
business-ops = "business_ops.cli:main"
business-ops-analytics = "business_ops.analytics_cli:main"
business-ops-analyze = "business_ops.analyst_cli:main"
business-ops-classify = "business_ops.classify_cli:main"
business-ops-catalog = "business_ops.catalog_cli:main"
business-ops-database = "business_ops.database_cli:main"
business-ops-investigate = "business_ops.investigation_cli:main"
business-ops-documents = "business_ops.document_cli:main"
business-ops-query = "business_ops.query_cli:main"
business-ops-testbed = "business_ops.testbed_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
